<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Night of Luxe | Catálogo con Carrito y Cantidades</title>
    <style>
        body { 
            background-image: url('fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.7);
            background-blend-mode: darken;
            color: #f5f5f5; 
            font-family: sans-serif; 
            padding: 20px; 
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: #161616; padding: 15px; border: 1px solid #333; text-align: center; border-radius: 8px; }
        img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; }
        .price { font-size: 1.2em; color: #dfba6b; margin: 10px 0; font-weight: bold; }
        .size-btn { padding: 5px 10px; margin: 2px; border: 1px solid #555; background: none; color: white; cursor: pointer; }
        .size-btn.active { border-color: #dfba6b; background: #dfba6b; color: black; }
        .qty-input { width: 50px; padding: 5px; margin-top: 10px; background: #333; color: white; border: 1px solid #555; text-align: center; }
        .btn-add { background: #dfba6b; border: none; padding: 10px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #222; padding: 15px; text-align: center; border-top: 2px solid #dfba6b; z-index: 1000; }
    </style>
</head>
<body>

<div style="text-align: center; margin-top: 20px;">
    <img src="logo.png" alt="Night of Luxe Logo" style="max-width: 200px; height: auto;">
</div>

<h1 style="text-align: center; color: #dfba6b;">NIGHT OF LUXE</h1>

<div class="grid" id="catalog"></div>

<div class="cart-bar">
    <button onclick="sendWhatsApp()" style="background:#25d366; color:white; border:none; padding:15px; font-weight:bold; cursor:pointer;">
        FINALIZAR PEDIDO EN WHATSAPP (<span id="count">0</span>)
    </button>
</div>

<script>
    let cart = [];

    const products = [
        { name: 'Pijama Satinada Premium', price: 23000, img: 'pijama_satin_pantalon.jpeg', sizes: ['S','M','L','XL'] },
        { name: 'Vestido Sweet Minnie', price: 22000, img: 'pijama_minnie_rayas.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Avocado Love', price: 22000, img: 'pijama_aguacate.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Daisy Soft Pink', price: 22000, img: 'pijama_daisy.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Hello Kitty Stars', price: 22000, img: 'pijama_kitty_lila.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Hello Kitty Biscuit', price: 25000, img: 'pijama_kitty.jpeg', sizes: ['S','M','L','XL'] },
        { name: 'Set Rib Rojo + Botitas', price: 23000, img: 'pijama_botas.jpeg', sizes: ['S'] },
        { name: 'Set Garfield Fresh', price: 20000, img: 'pijama_garfield.jpeg', sizes: ['S','M','L','XL'] },
        { name: 'Pijama Infantil Deluxe', price: 35000, img: 'pijama_nino_deluxe.jpeg', sizes: ['2','4','6','8','10','12'] },
        { name: 'Pijama Infantil Niño', price: 28000, img: 'pijama_nino.jpeg', sizes: ['2','6','8'] },
        { name: 'Pijama Infantil (Pantalón)', price: 35000, img: 'pijama_nina_pantalon.jpeg', sizes: ['Cons.'] },
        { name: 'Batola Infantil', price: 20000, img: 'batola_nina.jpeg', sizes: ['8','10'] }
    ];

    function render() {
        const container = document.getElementById('catalog');
        container.innerHTML = products.map((p, i) => `
            <div class="card" id="card${i}">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p class="price">$${p.price.toLocaleString()}</p>
                <div>${p.sizes.map(s => `<button class="size-btn" onclick="selectSize(this, '${s}')">${s}</button>`).join('')}</div>
                <input type="number" class="qty-input" value="1" min="1" id="qty${i}">
                <button class="btn-add" onclick="addToCart('${p.name}', ${p.price}, 'card${i}', 'qty${i}')">AÑADIR</button>
            </div>
        `).join('');
    }

    function selectSize(btn, size) {
        btn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        btn.dataset.selected = size;
    }

    function addToCart(name, price, cardId, qtyId) {
        const selectedBtn = document.querySelector(`#${cardId} .size-btn.active`);
        const qty = parseInt(document.getElementById(qtyId).value);
        
        if (!selectedBtn) { 
            alert("¡Por favor elige una talla primero!"); 
            return; 
        }
        
        cart.push({ name: name, price: price, size: selectedBtn.dataset.selected, qty: qty });
        document.getElementById('count').innerText = cart.length;
    }

    function sendWhatsApp() {
        if (cart.length === 0) { alert("Tu carrito está vacío."); return; }
        
        let total = 0;
        let msg = "¡Hola! Quiero hacer el siguiente pedido:\n\n";
        
        cart.forEach((item, index) => {
            let subtotal = item.price * item.qty;
            total += subtotal;
            msg += (index + 1) + ". " + item.name + " | Talla: " + item.size + " | Cantidad: " + item.qty + " | $" + item.price.toLocaleString() + "\n";
        });
        
        msg += "\n--------------------------";
        msg += "\nTOTAL: $" + total.toLocaleString();
        msg += "\n\n¡Quedo atento a la confirmación!";
        
        window.location.href = 'https://wa.me/573144017339?text=' + encodeURIComponent(msg);
    }

    render();
</script>

</body>
</html>
