<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Night of Luxe | Catálogo Completo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        :root { --bg: #0d0d0d; --gold: #dfba6b; --text: #f5f5f5; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        header { text-align: center; padding: 40px; border-bottom: 1px solid var(--gold); margin-bottom: 30px; }
        h1 { font-family: 'Cormorant Garamond', serif; color: var(--gold); letter-spacing: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
        .card { background: #161616; border: 1px solid #333; padding: 20px; text-align: center; border-radius: 8px; }
        .img-prod { width: 100%; height: 300px; object-fit: cover; margin-bottom: 15px; border-radius: 4px; }
        .price { color: var(--gold); font-weight: bold; margin: 10px 0; }
        .size-btn { padding: 5px 10px; margin: 2px; border: 1px solid #555; background: none; color: #fff; cursor: pointer; font-size: 11px; }
        .size-btn.active { border-color: var(--gold); background: var(--gold); color: #000; font-weight: 600; }
        .btn-add { width: 100%; padding: 12px; background: var(--gold); border: none; cursor: pointer; font-weight: bold; margin-top: 15px; text-transform: uppercase; }
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #000; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header><h1>NIGHT OF LUXE</h1></header>

<div class="grid" id="catalog"></div>

<div class="floating-cart" onclick="sendWhatsApp()">PEDIR POR WHATSAPP</div>

<script>
    const products = [
        // --- MUJER ---
        { name: 'Pijama Satinada Premium', price: 23000, img: 'pijama_satin_pantalon.jpeg', sizes: ['S','M','L','XL'] },
        { name: 'Vestido Sweet Minnie', price: 22000, img: 'pijama_minnie_rayas.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Avocado Love', price: 22000, img: 'pijama_aguacate.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Daisy Soft Pink', price: 22000, img: 'pijama_daisy.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Hello Kitty Stars', price: 22000, img: 'pijama_kitty_lila.jpeg', sizes: ['S','M','L'] },
        { name: 'Set Hello Kitty Biscuit', price: 25000, img: 'pijama_kitty.jpeg', sizes: ['S','M','L','XL'] },
        { name: 'Set Rib Rojo + Botitas', price: 23000, img: 'pijama_botas.jpeg', sizes: ['S'] },
        { name: 'Set Garfield Fresh', price: 20000, img: 'pijama_garfield.jpeg', sizes: ['S','M','L','XL'] },
        // --- INFANTIL ---
        { name: 'Pijama Infantil Deluxe', price: 35000, img: 'pijama_nino_deluxe.jpeg', sizes: ['2','4','6','8','10','12'] },
        { name: 'Pijama Infantil Niño', price: 28000, img: 'pijama_nino.jpeg', sizes: ['2','6','8'] },
        { name: 'Pijama Infantil (Pantalón)', price: 35000, img: 'pijama_nina_pantalon.jpeg', sizes: ['Cons.'] },
        { name: 'Batola Infantil', price: 20000, img: 'batola_nina.jpeg', sizes: ['8','10'] }
    ];

    function render() {
        const cat = document.getElementById('catalog');
        cat.innerHTML = products.map((p, i) => `
            <div class="card" id="p${i}">
                <img src="${p.img}" class="img-prod">
                <h3>${p.name}</h3>
                <p class="price">$ ${p.price.toLocaleString()} COP</p>
                <div class="sizes">${p.sizes.map(s => `<button class="size-btn" onclick="select(this)">${s}</button>`).join('')}</div>
                <button class="btn-add" onclick="alert('Producto seleccionado. Dale clic al botón de WhatsApp para pedir.')">AÑADIR</button>
            </div>
        `).join('');
    }

    function select(btn) {
        btn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function sendWhatsApp() {
        window.open('https://wa.me/573144017339?text=Hola, quiero pedir las siguientes pijamas de Night of Luxe:');
    }

    render();
</script>
</body>
</html>
