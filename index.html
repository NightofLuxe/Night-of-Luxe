<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night of Luxe | Catálogo Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        :root { --bg-dark: #0d0d0d; --gold: #dfba6b; --rose: #e5b0b0; --text: #f5f5f5; }
        body { background-color: var(--bg-dark); color: var(--text); }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 35px; }
        .product-card { background: #161616; border: 1px solid rgba(223,186,107,0.15); border-radius: 6px; overflow: hidden; padding: 20px; text-align: center; }
        .product-image { width: 100%; height: 300px; object-fit: cover; margin-bottom: 15px; }
        .product-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; margin-bottom: 5px; }
        .price { color: var(--gold); font-weight: 600; margin-bottom: 15px; }
        .size-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 15px; }
        .size-btn { padding: 5px 10px; border: 1px solid #333; cursor: pointer; background: transparent; color: #fff; font-size: 11px; }
        .size-btn.active { border-color: var(--gold); background: var(--gold); color: #000; }
        .btn-add { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>

<main class="main-container">
    <div class="catalog-grid">
        <div class="product-card" id="prod_deluxe">
            <img src="pijama_nino_deluxe.jpeg" class="product-image">
            <h3 class="product-title">Pijama Infantil Deluxe</h3>
            <p class="price">$ 35.000 COP</p>
            <div class="size-selector">
                <button class="size-btn active" onclick="select(this)">2</button>
                <button class="size-btn" onclick="select(this)">4</button>
                <button class="size-btn" onclick="select(this)">6</button>
                <button class="size-btn" onclick="select(this)">8</button>
                <button class="size-btn" onclick="select(this)">10</button>
                <button class="size-btn" onclick="select(this)">12</button>
            </div>
            <button class="btn-add" onclick="add('Pijama Infantil Deluxe', 35000, 'prod_deluxe')">Añadir</button>
        </div>
        </div>
</main>

<script>
    function select(btn) {
        btn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    // ... resto de funciones add() y send() igual que antes
</script>
</body>
</html>
